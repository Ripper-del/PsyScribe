version: '3.8'

services:
  backend:
    build: ./backend
    container_name: psyscribe-backend
    ports:
      - "3000:3000"
    # Бекенд буде брати змінні з файлу .env у папці backend
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: psyscribe-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend